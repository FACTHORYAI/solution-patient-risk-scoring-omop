[project]
name = "patient_risk_scoring_omop"
version = "0.1.0"
description = "Score patient risk from OMOP condition history, as tables in Facthory."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "numpy>=1.26",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]

[project.scripts]
patient_risk_scoring_omop = "patient_risk_scoring_omop.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_risk_scoring_omop"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"data/generate_sample.py" = ["E501"]
